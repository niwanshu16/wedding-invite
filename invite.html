<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wedding Invitation</title>
  <style>
    :body { font-family: Georgia, serif; margin: 0; background: #f9f5ef; color: #333; }
    main { min-height: 100vh; display: grid; place-items: center; padding: 2rem; box-sizing: border-box; }
    .invite { max-width: 620px; text-align: center; border: 1px solid #b79a58; background: #fff; padding: 3rem 2rem; box-shadow: 0 10px 30px rgba(0,0,0,.08); }
    h1 { font-size: clamp(2.5rem, 8vw, 5rem); margin: .25em 0; color: #8a6240; }
    .names { font-size: clamp(1.8rem, 5vw, 3rem); }
    .details { margin-top: 2rem; line-height: 1.8; }
  </style>
</head>
<body>
  <main>
    <article class="invite">
      <p>Together with their families</p>
      <div class="names"><strong>Aarav</strong> &amp; <strong>Meera</strong></div>
      <h1>invite you</h1>
      <p>to celebrate their wedding</p>
      <div class="details">
        <strong>Saturday, December 12, 2026</strong><br>
        <span>at 5:00 PM</span><br>
        <span>The Garden Courtyard</span><br>
        <span>Jaipur, Rajasthan</span>
      </div>
    </article>
  </main>
</body>
</html>
